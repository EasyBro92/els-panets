<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Els Panets</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#4ec0ca" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Els Panets" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="nameOverlay" class="hidden">
    <div class="nameCard">
      <div class="nameTitle">¡Nuevo récord! 🎉</div>
      <div class="nameSubtitle">¿Cómo te llamas?</div>
      <input id="nameInput" type="text" maxlength="12" autocomplete="off" placeholder="Tu nombre" />
      <button id="nameSubmit">Guardar</button>
    </div>
  </div>
  <div id="leaderboardOverlay" class="hidden">
    <div class="nameCard">
      <div class="nameTitle">🌍 Ranking mundial</div>
      <ol id="leaderboardList" class="lbList"><li class="lbEmpty">Cargando…</li></ol>
      <button id="leaderboardClose">Cerrar</button>
    </div>
  </div>
</div>
<script type="module" src="firebase-leaderboard.js"></script>
<script src="game.js"></script>
</body>
</html>
