<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Els Panets</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#5cbae8" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Els Panets" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="nameOverlay" class="hidden">
    <div class="nameCard">
      <div class="nameTitle">¡Nuevo récord!</div>
      <div class="nameSubtitle">¿Cómo te llamas?</div>
      <input id="nameInput" type="text" maxlength="12" autocomplete="off" placeholder="Tu nombre" />
      <button id="nameSubmit">Guardar</button>
    </div>
  </div>
  <div id="leaderboardOverlay" class="hidden">
    <div class="nameCard">
      <div class="nameTitle">Ranking mundial</div>
      <div id="lbTabs" class="tabs hidden"><button type="button" data-tab="jugadores">Jugadores</button><button type="button" data-tab="paises">Países</button></div>
      <ol id="leaderboardList" class="lbList"><li class="lbEmpty">Cargando…</li></ol>
      <button id="leaderboardClose">Cerrar</button>
    </div>
  </div>
  <!-- 03/11/2026: crear tu personaje y el admin -->
  <div id="creatorOverlay" class="overlay hidden">
    <div class="nameCard wideCard creatorCard">
      <div class="nameTitle">Crea tu personaje</div>
      <div class="cTop">
        <canvas id="creatorPreview" width="240" height="250"></canvas>
        <div class="cTopRight">
          <input id="creatorName" type="text" maxlength="12" autocomplete="off" placeholder="Su nombre" />
          <p class="cNote">El admin tiene que aprobarlo. Si lo deniega, se borra y podrás crear otro a las 24 h.</p>
        </div>
      </div>
      <div id="creatorRows" class="creatorRows"></div>
      <p id="creatorMsg" class="formMsg"></p>
      <div class="cBtns">
        <button id="creatorCancel" class="ghostBtn" type="button">Cancelar</button>
        <button id="creatorSend" class="bigBtn" type="button">Enviar al admin</button>
      </div>
    </div>
  </div>
  <div id="adminLoginOverlay" class="overlay hidden">
    <div class="nameCard">
      <div class="nameTitle">Admin</div>
      <div class="nameSubtitle">Escribe tu código</div>
      <input id="adminPin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••••••" />
      <p id="adminLoginMsg" class="formMsg"></p>
      <button id="adminLoginBtn" class="bigBtn" type="button">Entrar</button>
      <button id="adminLoginClose" class="ghostBtn" type="button">Cerrar</button>
    </div>
  </div>
  <div id="adminOverlay" class="overlay hidden">
    <div class="nameCard wideCard">
      <div class="nameTitle">Panel del admin</div>
      <div id="adminTabs" class="tabs"><button type="button" data-tab="tiempo" class="on">Tiempo</button><button type="button" data-tab="personajes">Personajes</button><button type="button" data-tab="ajustes">Ajustes</button></div>
      <div id="adminBody" class="adminBody"></div>
      <button id="adminClose" class="bigBtn" type="button">Cerrar</button>
      <button id="adminLogout" class="ghostBtn" type="button">Salir del modo admin</button>
    </div>
  </div>
  <button id="adminBtn" class="hidden" type="button">ADMIN</button>
  <button id="installBtn" class="hidden" type="button"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg> Instalar el juego</button>
  <div id="installOverlay" class="hidden">
    <div class="nameCard">
      <div class="nameTitle">Instalar Els Panets</div>
      <div id="installSteps" class="installSteps"></div>
      <button id="installClose">Cerrar</button>
    </div>
  </div>
</div>
<script>
// Botón para instalar el juego en Android y iPhone (solo en la web, no en la app)
(function () {
  const btn = document.getElementById("installBtn");
  const ov = document.getElementById("installOverlay");
  const steps = document.getElementById("installSteps");
  const ua = navigator.userAgent;
  const iOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const android = /Android/i.test(ua);
  const installed = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true || location.hostname === "els.panets";
  if (installed) return;
  let deferred = null;
  btn.classList.remove("hidden");
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferred = e; });
  window.addEventListener("appinstalled", () => { btn.classList.add("hidden"); ov.classList.add("hidden"); });
  const SHARE = "<svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" style=\"vertical-align:-4px\"><path d=\"M12 3v12M7 8l5-5 5 5\" fill=\"none\" stroke=\"#1a73e8\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M6 11H5v9h14v-9h-1\" fill=\"none\" stroke=\"#1a73e8\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>";
  function show(html) { steps.innerHTML = html; ov.classList.remove("hidden"); }
  btn.addEventListener("click", async (e) => {
    e.stopPropagation();
    if (iOS) {
      show("<ol><li>Abre esta página en <b>Safari</b>.</li><li>Toca el botón <b>Compartir</b> " + SHARE + " de abajo.</li><li>Elige <b>Añadir a pantalla de inicio</b>.</li><li>Toca <b>Añadir</b>. ¡Listo!</li></ol>");
      return;
    }
    if (deferred) {
      deferred.prompt();
      try { await deferred.userChoice; } catch (err) {}
      deferred = null;
      return;
    }
    if (android) {
      show("<a class=\"apkBtn\" href=\"descargas/ElsPanets.apk\" download>Descargar la app (APK)</a><p class=\"installNote\">Ábrela al terminar y acepta instalar. Se actualiza sola.</p><p class=\"installNote\">O en Chrome: menú <b>⋮</b> → <b>Añadir a pantalla de inicio</b>.</p>");
      return;
    }
    show("<p class=\"installNote\">En el ordenador, pulsa el icono de instalar de la barra de direcciones del navegador.</p><p class=\"installNote\">En el móvil, abre esta página y pulsa este mismo botón.</p>");
  });
  document.getElementById("installClose").addEventListener("click", (e) => { e.stopPropagation(); ov.classList.add("hidden"); });
  ov.addEventListener("pointerdown", (e) => e.stopPropagation());
  btn.addEventListener("pointerdown", (e) => e.stopPropagation());
})();
</script>
<script type="module" src="firebase-leaderboard.js"></script>
<script src="game.js"></script>
<script src="extras.js"></script>
</body>
</html>
